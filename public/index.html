<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ponscan — Token Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --accent: #00d4ff; --accent2: #7c3aed; --green: #22c55e; --red: #ef4444; --text2: #94a3b8; }
  .cursor { animation: blink 1s step-end infinite; color: var(--green); }
  @keyframes blink { 50% { opacity: 0; } }
  body {
    font-family: 'Space Grotesk', sans-serif;
    background: #07070d; color: #e2e8f0; min-height: 100vh; overflow-x: hidden;
  }
  .hero-bg { position: fixed; inset: 0; z-index: 0; background: #04060a; }
  .hero-bg canvas { width: 100%; height: 100%; display: block; }
  .hero-overlay {
    position: fixed; inset: 0; z-index: 1;
    background: radial-gradient(ellipse 70% 55% at 50% 40%, rgba(4,6,10,.35) 0%, rgba(4,6,10,.82) 100%);
  }
  .wrapper { position: relative; z-index: 2; max-width: 820px; margin: 0 auto; padding: 40px 16px 60px; }

  header {
    text-align: center;
    background: rgba(255,255,255,.05); backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,.08); border-radius: 20px;
    padding: 36px 24px 28px; margin-bottom: 28px;
  }
  header h1 { font-size: clamp(22px,4vw,32px); font-weight: 600; letter-spacing: -.5px; line-height: 1.15; }
  header h1 .word { display: inline-block; opacity: 0; transform: translateY(20px) scale(.95); }
  header h1 .word.show { animation: wordPop .5s cubic-bezier(.22,.61,.36,1) forwards; }
  @keyframes wordPop { to { opacity: 1; transform: translateY(0) scale(1); } }
  #tagline { opacity: 0; transform: translateY(12px); transition: all .6s cubic-bezier(.22,.61,.36,1); font-size: 14px; margin-top: 8px; }
  #tagline.show { opacity: 1; transform: translateY(0); }

  .search-box {
    display: flex; gap: 10px; max-width: 640px; margin: 0 auto 28px;
    opacity: 0; transform: translateY(16px); transition: all .6s cubic-bezier(.22,.61,.36,1);
  }
  .search-box.show { opacity: 1; transform: translateY(0); }
  .search-box input {
    flex: 1; padding: 16px 20px; border-radius: 14px;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.06); backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #fff; font-family: 'JetBrains Mono', monospace; font-size: 13px;
    outline: none; transition: border-color .25s;
  }
  .search-box input:focus { border-color: rgba(0,212,255,.5); }
  .search-box input::placeholder { color: rgba(255,255,255,.3); font-family: 'Space Grotesk', sans-serif; }
  .search-box button {
    padding: 16px 32px; border-radius: 14px; border: none;
    background: #000; color: #fff; font-weight: 600; font-size: 14px;
    cursor: pointer; transition: opacity .2s, transform .1s; white-space: nowrap;
  }
  .search-box button:hover { opacity: .85; }
  .search-box button:active { transform: scale(.97); }
  .search-box button:disabled { opacity: .4; cursor: not-allowed; }
  @media (max-width:640px) { .search-box { flex-direction: column; } .search-box input { text-align: center; } .search-box button { width: 100%; } }

  .loading { display: none; text-align: center; padding: 50px 0; }
  .loading.active { display: block; }
  .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,.1); border-top-color: #00d4ff; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading p { color: rgba(255,255,255,.4); font-size: 14px; }

  .error { display: none; padding: 14px 18px; border-radius: 14px; background: rgba(239,68,68,.12); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(239,68,68,.2); color: #ef4444; font-size: 14px; margin-bottom: 24px; }
  .error.active { display: block; }

  .results { display: none; }
  .results.active { display: block; }

  .card {
    background: rgba(255,255,255,.04); backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.07);
    border-radius: 18px; padding: 20px 22px; margin-bottom: 14px;
    opacity: 0; transform: translateY(18px); transition: all .6s cubic-bezier(.22,.61,.36,1);
  }
  .card.show { opacity: 1; transform: translateY(0); }
  .card-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: rgba(255,255,255,.3); margin-bottom: 14px; font-weight: 600; }

  /* Token header */
  .token-header { display: flex; align-items: center; gap: 18px; }
  .token-icon { width: 56px; height: 56px; border-radius: 16px; flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; }
  .token-icon img { width: 100%; height: 100%; object-fit: cover; }
  .token-icon .fallback { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; }
  .token-info h2 { font-size: 22px; font-weight: 600; }
  .token-info .symbol { color: rgba(255,255,255,.45); font-size: 13px; }
  .token-meta { display: flex; gap: 14px; margin-top: 6px; flex-wrap: wrap; }
  .token-meta span { color: rgba(255,255,255,.35); font-size: 12px; }
  .token-meta .value { color: rgba(255,255,255,.6); font-family: 'JetBrains Mono', monospace; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width:640px) { .grid-2 { grid-template-columns: 1fr; } }

  .addr-row { display: flex; align-items: center; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: rgba(255,255,255,.5); padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
  .addr-row:last-child { border-bottom: none; }
  .addr-row .alabel { color: rgba(255,255,255,.3); font-family: 'Space Grotesk', sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: .5px; min-width: 55px; }
  .addr { cursor: pointer; word-break: break-all; transition: color .2s; }
  .addr:hover { color: #00d4ff; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
  .badge-eoa { background: rgba(34,197,94,.12); color: #22c55e; }
  .badge-contract { background: rgba(245,158,11,.12); color: #f59e0b; }
  .badge-verified { background: rgba(34,197,94,.12); color: #22c55e; }
  .badge-unverified { background: rgba(239,68,68,.12); color: #ef4444; }
  .badge-pons { background: rgba(0,212,255,.12); color: #00d4ff; }

  .bal-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
  .bal-row:last-child { border-bottom: none; }
  .bal-row .bl { color: rgba(255,255,255,.35); font-size: 12px; }
  .bal-row .bv { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #e2e8f0; }

  .holder-item { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 12px; font-family: 'JetBrains Mono', monospace; }
  .holder-bar-wrap { flex: 1; height: 5px; background: rgba(255,255,255,.06); border-radius: 3px; overflow: hidden; }
  .holder-bar { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #00d4ff, #7c3aed); }
  .holder-addr { color: rgba(255,255,255,.5); cursor: pointer; min-width: 110px; }
  .holder-addr:hover { color: #00d4ff; }
  .holder-pct { color: rgba(255,255,255,.35); min-width: 55px; text-align: right; }

  .fund-item { padding: 4px 0; font-size: 13px; }
  .fund-item .fl { color: rgba(255,255,255,.3); font-size: 11px; }
  .fund-item .fv { color: #e2e8f0; font-family: 'JetBrains Mono', monospace; font-size: 12px; }

  .tag-link { color: #00d4ff; text-decoration: none; font-size: 12px; }
  .tag-link:hover { text-decoration: underline; }

  .dex-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .dex-cell { padding: 5px 0; }
  .dex-cell .dl { color: rgba(255,255,255,.3); font-size: 11px; }
  .dex-cell .dv { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #e2e8f0; }
  .p-up { color: #22c55e; } .p-down { color: #ef4444; }

  .null-state { color: rgba(255,255,255,.3); font-size: 12px; font-style: italic; }
  .links-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: rgba(255,255,255,.08); backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.1);
    padding: 10px 22px; border-radius: 10px; font-size: 13px; color: rgba(255,255,255,.6);
    opacity: 0; transition: all .3s; pointer-events: none; z-index: 99;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  footer { text-align: center; padding: 40px 0 20px; color: rgba(255,255,255,.25); font-size: 12px; margin-top: 20px; }
</style>
</head>
<body>
<div class="hero-bg"><canvas id="matrixCanvas"></canvas></div>
<div class="hero-overlay"></div>
<div class="wrapper">
  <header>
    <h1 id="headingWrap"><span id="headingWords"></span></h1>
    <p id="tagline"><span style="color:var(--accent)">$</span> <span style="color:var(--text2)">./ponscan</span> <span style="color:var(--green)">--scan</span> <span style="color:var(--accent2)">0x...</span><span class="cursor">_</span></p>
  </header>
  <div class="search-box" id="searchBox">
    <input type="text" id="caInput" placeholder="0x..." spellcheck="false">
    <button id="scanBtn">Scan Token</button>
  </div>
  <div class="loading" id="loading"><div class="spinner"></div><p>Scanning token on-chain…</p></div>
  <div class="error" id="error"></div>
  <div class="results" id="results">
    <div class="card" data-step="0">
      <div class="token-header">
        <div class="token-icon" id="tokenIcon"><span class="fallback" id="iconFallback">?</span></div>
        <div class="token-info" id="tokenInfoArea">
          <h2 id="tokenName">—</h2>
          <div class="symbol" id="tokenSymbol">—</div>
          <div class="token-meta" id="tokenMeta"></div>
        </div>
      </div>
    </div>
    <div class="grid-2">
      <div class="card" data-step="1"><div class="card-title">👤 Developer</div><div id="devContent"></div></div>
      <div class="card" data-step="2"><div class="card-title">💰 Funding Trace</div><div id="fundingContent"></div></div>
    </div>
    <div class="grid-2">
      <div class="card" data-step="3"><div class="card-title">📊 Top Holders</div><div id="holdersContent"></div></div>
      <div class="card" data-step="4"><div class="card-title">📈 DexScreener</div><div id="dexContent"></div></div>
    </div>
    <div class="card" data-step="5"><div class="card-title">🔗 Links</div><div class="links-row" id="linksContent"></div></div>
  </div>
  <footer>Ponscan — built on Robinhood Chain</footer>
</div>
<div class="toast" id="toast"></div>
<script>
const API = new URLSearchParams(window.location.search).get('api') || window.location.origin;
const $ = s => document.querySelector(s);
function copy(t) { navigator.clipboard.writeText(t).then(() => { const o=$('#toast'); o.textContent='Copied!'; o.classList.add('show'); setTimeout(()=>o.classList.remove('show'),1500); }); }
function shortAddr(a) { return a ? a.slice(0,6)+'…'+a.slice(-4) : '—'; }
function bsLink(a) { return 'https://robinhoodchain.blockscout.com/address/'+a; }

// Generate unique gradient & icon from address
function addrToGradient(addr) {
  if (!addr) return { bg: 'rgba(0,212,255,.15)', text: '#00d4ff' };
  const h = parseInt(addr.slice(2, 8), 16);
  const hue = h % 360;
  const s = 55 + (h >> 8 & 0x3f) % 30;
  const l = 35 + (h >> 16 & 0x7) % 15;
  const bg = `linear-gradient(135deg, hsl(${hue},${s}%,${l}%), hsl(${(hue+40)%360},${s}%,${l-10}%))`;
  const text = `hsl(${hue},${s+10}%,${l+30}%)`;
  return { bg, text };
}

// Word animation
const w = "Ponscan — Token Intelligence".split(' ');
$('#headingWords').innerHTML = w.map(w=>`<span class="word">${w}</span>`).join(' ');
const wordEls = document.querySelectorAll('.word');
const tagline = $('#tagline');
function animate() {
  wordEls.forEach((e,i)=>setTimeout(()=>e.classList.add('show'),120+i*100));
  const end = 120 + wordEls.length*100 + 150;
  setTimeout(()=>tagline.classList.add('show'), end);
  setTimeout(()=>$('#searchBox').classList.add('show'), end+200);
}

$('#scanBtn').addEventListener('click', scan);
$('#caInput').addEventListener('keydown', e=>{if(e.key==='Enter') scan();});

async function scan() {
  const ca = $('#caInput').value.trim();
  if (!ca || !/^0x[a-fA-F0-9]{40}$/.test(ca)) { showError('Invalid contract address.'); return; }
  hideError();
  $('#loading').classList.add('active');
  $('#results').classList.remove('active');
  $('#scanBtn').disabled = true;
  try {
    const res = await fetch(`${API}/scan?ca=${ca}`);
    if (!res.ok) {
      const body = await res.text();
      try { throw new Error(JSON.parse(body).error); } catch(e) { if(!e.message) throw new Error('HTTP '+res.status); throw e; }
    }
    render(await res.json());
    animateResults();
    $('#results').classList.add('active');
  } catch(e) { showError(e.message); }
  finally { $('#loading').classList.remove('active'); $('#scanBtn').disabled = false; }
}

function animateResults() { document.querySelectorAll('.card[data-step]').forEach((c,i)=>setTimeout(()=>c.classList.add('show'),100+i*80)); }

function render(d) {
  // Token icon — real logo (pons launchpad > blockscout > dex) or unique gradient
  const iconUrl = d.tokenIcon || d.blockscout?.iconUrl || d.dex?.logoUrl || null;
  const iconEl = $('#tokenIcon');
  const fallback = $('#iconFallback');
  const g = addrToGradient(d.ca);
  const first = (d.symbol || d.name || '?')[0].toUpperCase();
  if (iconUrl) {
    iconEl.innerHTML = `<img src="${iconUrl}" alt="${d.symbol||''}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span class="fallback" style="display:none;background:${g.bg};color:${g.text}">${first}</span>`;
  } else {
    iconEl.innerHTML = `<span class="fallback" style="background:${g.bg};color:${g.text}">${first}</span>`;
  }

  $('#tokenName').textContent = d.name || '—';
  $('#tokenSymbol').textContent = (d.symbol || '—') + ' · ' + (d.decimals || '?') + ' decimals';
  let meta = '';
  if (d.totalSupply) { const ts=d.totalSupply.length>12?d.totalSupply.slice(0,6)+'…'+d.totalSupply.slice(-4):d.totalSupply; meta+='<span><span class="value">Supply </span><span class="value">'+ts+'</span></span>'; }
  if (d.codeSize) meta+='<span><span class="value">Code </span><span class="value">'+d.codeSize.toLocaleString()+' B</span></span>';
  if (d.blockscout?.holderCount) meta+='<span><span class="value">Holders </span><span class="value">'+d.blockscout.holderCount+'</span></span>';
  $('#tokenMeta').innerHTML = meta;

  // Dev
  let devHtml = '';
  if (d.dev) {
    devHtml += '<div class="addr-row"><span class="alabel">Address</span><span class="addr" onclick="copy(\''+d.dev+'\')">'+d.dev+'</span>'+(d.devIsContract?'<span class="badge badge-contract">Contract</span>':'<span class="badge badge-eoa">EOA</span>')+'</div>';
    if (d.devLabel) devHtml+='<div class="addr-row"><span class="alabel">Role</span><span class="badge badge-pons">'+d.devLabel+'</span></div>';
    if (d.devBalanceFormatted!=null) devHtml+='<div class="bal-row"><span class="bl">Token Balance</span><span class="bv">'+d.devBalanceFormatted+' '+(d.symbol||'')+'</span></div>';
    if (d.devEthBalance) devHtml+='<div class="bal-row"><span class="bl">ETH Balance</span><span class="bv">'+d.devEthBalance+' ETH</span></div>';
    if (d.deployInfo) devHtml+='<div class="bal-row"><span class="bl">Deploy Block</span><span class="bv">#'+(d.deployInfo.deployBlock?.toLocaleString()||'?')+'</span></div>';
  } else devHtml='<div class="null-state">Dev address not found</div>';
  $('#devContent').innerHTML = devHtml;

  // Funding
  let fundHtml = '';
  if (d.devFunding && d.devFunding.fundedBy && d.devFunding.fundedBy!=='unknown') {
    fundHtml+='<div class="fund-item"><span class="fl">Funded by</span><div class="fv" style="cursor:pointer" onclick="copy(\''+d.devFunding.fundedBy+'\')">'+d.devFunding.fundedBy+'</div></div>';
    if (d.devFunding.fundedValueEth) fundHtml+='<div class="fund-item"><span class="fl">First inflow</span><div class="fv">'+d.devFunding.fundedValueEth+' ETH</div></div>';
    if (d.devFunding.fundedTx) fundHtml+='<div class="fund-item"><span class="fl">Tx</span><div class="fv" style="font-size:11px;cursor:pointer" onclick="copy(\''+d.devFunding.fundedTx+'\')">'+shortAddr(d.devFunding.fundedTx)+'</div></div>';
    if (d.devFunding.totalIncomingTxs) fundHtml+='<div class="fund-item"><span class="fl">Total incoming</span><div class="fv">'+d.devFunding.totalIncomingTxs+' txs</div></div>';
  } else fundHtml='<div class="null-state">No funding trace found</div>';
  $('#fundingContent').innerHTML = fundHtml;

  // Holders
  let hHtml = '';
  if (d.topHolders && d.topHolders.length) {
    const maxPct = d.topHolders.reduce((m,h)=>Math.max(m,parseFloat(h.percentage)||0),0);
    d.topHolders.forEach((h,i)=>{
      const pct=parseFloat(h.percentage)||0;
      const bw=maxPct>0?(pct/maxPct*100):0;
      hHtml+='<div class="holder-item"><span style="color:rgba(255,255,255,.3);min-width:18px">'+(i+1)+'</span><span class="holder-addr" onclick="copy(\''+h.address+'\')">'+shortAddr(h.address)+'</span><div class="holder-bar-wrap"><div class="holder-bar" style="width:'+bw+'%"></div></div><span class="holder-pct">'+(h.percentage||'0%')+'</span></div>';
    });
    if (d.holderCount>10) hHtml+='<div style="color:rgba(255,255,255,.25);font-size:11px;margin-top:6px;text-align:center">+ '+(d.holderCount-10)+' more holders</div>';
  } else hHtml='<div class="null-state">No holder data available</div>';
  $('#holdersContent').innerHTML = hHtml;

  // DexScreener — with price change colors
  let dexHtml = '';
  if (d.dex) {
    const pc = d.dex.priceChange24h;
    const pcCls = pc>0?'p-up':pc<0?'p-down':'';
    const pcStr = pc!=null?(pc>0?'+':'')+pc.toFixed(2)+'%':'—';
    const pc5 = d.dex.priceChange5m;
    const pc5Cls = pc5>0?'p-up':pc5<0?'p-down':'';
    const pc5Str = pc5!=null?(pc5>0?'+':'')+pc5.toFixed(2)+'%':'—';
    const price = d.dex.priceUsd?parseFloat(d.dex.priceUsd):null;
    dexHtml='<div class="dex-grid">';
    dexHtml+='<div class="dex-cell"><div class="dl">Price</div><div class="dv">'+(price!=null?'$'+price.toFixed(12):'—')+'</div></div>';
    dexHtml+='<div class="dex-cell"><div class="dl">24h Change</div><div class="dv '+pcCls+'">'+pcStr+'</div></div>';
    dexHtml+='<div class="dex-cell"><div class="dl">5m Change</div><div class="dv '+pc5Cls+'">'+pc5Str+'</div></div>';
    dexHtml+='<div class="dex-cell"><div class="dl">Liquidity</div><div class="dv">'+(d.dex.liquidity?'$'+Number(d.dex.liquidity).toLocaleString():'—')+'</div></div>';
    dexHtml+='<div class="dex-cell"><div class="dl">FDV</div><div class="dv">'+(d.dex.fdv?'$'+Number(d.dex.fdv).toLocaleString():'—')+'</div></div>';
    dexHtml+='<div class="dex-cell"><div class="dl">24h Vol</div><div class="dv">'+(d.dex.volume24h?'$'+Number(d.dex.volume24h).toLocaleString():'—')+'</div></div>';
    dexHtml+='<div class="dex-cell"><div class="dl">Pair</div><div class="dv">'+(d.dex.pair||'—')+'</div></div>';
    dexHtml+='<div class="dex-cell"><div class="dl">Pairs</div><div class="dv">'+(d.dex.pairCount||0)+'</div></div>';
    dexHtml+='</div>';
    if (d.dex.dexUrl) dexHtml+='<div style="margin-top:8px"><a href="'+d.dex.dexUrl+'" target="_blank" class="tag-link">↗ View on DexScreener</a></div>';
  } else dexHtml='<div class="null-state">No DEX data available</div>';
  $('#dexContent').innerHTML = dexHtml;

  // Links
  let linksHtml = '';
  linksHtml+='<a href="https://www.ponsfamily.com/launchpad/'+d.ca+'" target="_blank" class="tag-link" style="padding:4px 10px;border-radius:6px;background:rgba(0,212,255,.12);color:#00d4ff;font-weight:600;border:1px solid rgba(0,212,255,.25)">⛽ Pons Launchpad</a>';
  if (d.verified) linksHtml+='<span class="badge badge-verified">✓ Verified</span>'; else linksHtml+='<span class="badge badge-unverified">✗ Unverified</span>';
  if (d.ponsFee) linksHtml+='<span class="badge badge-pons">Fee '+d.ponsFee+' bps</span>';
  if (d.v2Pair) linksHtml+='<a href="'+bsLink(d.v2Pair)+'" target="_blank" class="tag-link">↗ V2 Pair</a>';
  if (d.xHandles && d.xHandles.length) d.xHandles.forEach(h=>{linksHtml+='<a href="https://x.com/'+h+'" target="_blank" class="tag-link">🐦 @'+h+'</a>';});
  linksHtml+='<a href="'+bsLink(d.ca)+'" target="_blank" class="tag-link">↗ Blockscout</a>';
  $('#linksContent').innerHTML = linksHtml;
}
function showError(m) { $('#error').textContent='⚠ '+m; $('#error').classList.add('active'); }
function hideError() { $('#error').classList.remove('active'); }

// Matrix rain
(function(){
  const c=document.getElementById('matrixCanvas'),ctx=c.getContext('2d');
  const g='01アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789abcdefABCDEF$#@%&*+=<>/\\[]{}:;?';
  const fs=16; let cols=0,drops=[];
  function resize(){ c.width=window.innerWidth; c.height=window.innerHeight; cols=Math.floor(c.width/fs); drops=Array(cols).fill(1).map(()=>Math.random()*-50); }
  resize(); window.addEventListener('resize',resize);
  function draw(){
    ctx.fillStyle='rgba(4,6,10,0.08)'; ctx.fillRect(0,0,c.width,c.height); ctx.font=fs+'px monospace';
    for(let i=0;i<drops.length;i++){
      const ch=g[Math.floor(Math.random()*g.length)],x=i*fs,y=drops[i]*fs;
      if(Math.random()<0.1){ ctx.fillStyle='rgba(0,212,255,0.9)'; ctx.shadowColor='rgba(0,212,255,0.6)'; ctx.shadowBlur=8; }
      else{ ctx.fillStyle='rgba(34,197,94,0.35)'; ctx.shadowBlur=0; }
      ctx.fillText(ch,x,y); if(y>c.height&&Math.random()>0.975) drops[i]=0; drops[i]++;
    }
  }
  setInterval(draw,50);
})();

if (document.readyState==='complete') animate(); else window.addEventListener('load', animate);
</script>
</body>
